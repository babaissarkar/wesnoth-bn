name: Translation Checks

on:
  push:
    paths:
      - '**/*.po'
      - 'check_inner_newlines.py'
      - '.github/workflows/po-check.yml'
  pull_request:
    paths:
      - '**/*.po'
      - 'check_inner_newlines.py'
      - '.github/workflows/po-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          python -m pip install polib

      - name: Compile Bengali PO files
        run: |
          status=0
          while IFS= read -r -d '' f; do
            echo "Checking $f"
            out=$(msgfmt --check --check-format -o /dev/null "$f" 2>&1) || status=1
            if [ -n "$out" ]; then
              echo "$out"
              status=1
            fi
          done < <(find . -type f -name 'bn.po' -print0)
          exit $status

      - name: Check translated newlines
        run: |
          find . -type f -name 'bn.po' -print0 |
            xargs -0 -r -n1 python check_inner_newlines.py
